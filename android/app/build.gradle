apply plugin: 'com.android.application'

def returnHost = project.findProperty('returnHost') ?: 'not-configured.invalid'
assert returnHost ==~ /[A-Za-z0-9.-]+/
def edgeOrigin = project.findProperty('edgeOrigin') ?: System.getenv('EDGE_ORIGIN') ?: 'https://slotorhub-config.bogoradkseniamaksimovna.workers.dev'
if (edgeOrigin) {
    def uri = new URI(edgeOrigin)
    assert uri.scheme == 'https' && uri.host && !uri.userInfo && !uri.query && !uri.fragment
    assert !uri.path || uri.path == '/'
    edgeOrigin = edgeOrigin.replaceAll('/+$', '')
}
def signingData = new Properties()
def signingFile = rootProject.file('../keystore.properties')
if (signingFile.isFile()) signingFile.withInputStream { signingData.load(it) }
if (!signingData.getProperty('storeFile')) {
    def legacyInfo = rootProject.file('../KEYSTORE/com.cosmoland.club.c1249c1e-keystore-info.txt')
    if (legacyInfo.isFile()) {
        def legacy = new Properties()
        legacyInfo.withInputStream { legacy.load(it) }
        if (legacy.getProperty('KEYSTORE')) {
            signingData.setProperty('storeFile', rootProject.file('../KEYSTORE/' + legacy.getProperty('KEYSTORE')).absolutePath)
            ['storePassword':'STOREPASS', 'keyAlias':'ALIAS', 'keyPassword':'KEYPASS'].each { key, oldKey ->
                if (legacy.getProperty(oldKey)) signingData.setProperty(key, legacy.getProperty(oldKey))
            }
        }
    }
}
if (System.getenv('CM_KEYSTORE_PATH')) {
    ['storeFile':'CM_KEYSTORE_PATH', 'storePassword':'CM_KEYSTORE_PASSWORD',
     'keyAlias':'CM_KEY_ALIAS', 'keyPassword':'CM_KEY_PASSWORD'].each { key, env ->
        def value = System.getenv(env)
        assert value : "Missing Codemagic variable: ${env}"
        signingData.setProperty(key, value)
    }
}

android {
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (signingData.getProperty('storeFile')) {
                storeFile = new File(signingData.getProperty('storeFile')).isAbsolute()
                    ? new File(signingData.getProperty('storeFile'))
                    : rootProject.file('../' + signingData.getProperty('storeFile'))
                storePassword = signingData.getProperty('storePassword')
                keyAlias = signingData.getProperty('keyAlias')
                keyPassword = signingData.getProperty('keyPassword')
            }
        }
    }
    namespace = "com.cosmoland.club.c1249c1e"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.cosmoland.club.c1249c1e"
        buildConfigField "String", "EDGE_ORIGIN", "\"${edgeOrigin}\""
        buildConfigField "String", "RETURN_HOST", "\"${returnHost}\""
        manifestPlaceholders.returnHost = returnHost
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "1.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            if (signingData.getProperty("storeFile")) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
